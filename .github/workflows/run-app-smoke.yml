name: Run app smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "services/ssh_gateway/**"
      - ".github/workflows/run-app-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r services/api/requirements.txt

      - name: Start backend API
        run: |
          cd services/api
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../../api.log 2>&1 &
          echo $! > ../../api.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/docs > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          cat api.log
          exit 1

      - name: Start frontend dev server
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
          VITE_WS_BASE_URL: ws://127.0.0.1:8000
        run: |
          npm run dev-vite -- --host 127.0.0.1 --port 5173 > ../../web.log 2>&1 &
          echo $! > ../../web.pid

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend failed to start"
          cat web.log
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs
          path: |
            api.log
            web.log
